# Include once inside http {}. Only the Guard location applies these limits.
limit_req_zone $binary_remote_addr zone=voyah_guard_rate:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=voyah_guard_ip:1m;
limit_conn_zone $server_name zone=voyah_guard_total:1m;
# Codes are 8 characters: one shared budget for all addresses keeps guessing hopeless.
limit_req_zone $server_name zone=voyah_guard_all:1m rate=30r/m;
