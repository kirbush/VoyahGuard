plugins { id 'com.android.application' }

def customKeystore = providers.environmentVariable('VOYAH_SIGNING_KEYSTORE').orNull
def generatedNative = layout.buildDirectory.dir('generated/avmview')
interface ExecInjection { @javax.inject.Inject ExecOperations getExec() }
android {
    namespace 'local.codex.voyahcameralab'
    compileSdk 30
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'local.codex.voyahcameralab'
        minSdk 30
        targetSdk 30
        versionCode 7
        versionName '0.6-beta'
        testApplicationId 'local.codex.voyahcameratest'
        testInstrumentationRunner 'local.codex.voyahcameratest.Smoke'
        ndk { abiFilters 'arm64-v8a' } // The head unit; the OpenCV AAR ships other ABIs too.
    }
    signingConfigs {
        if (customKeystore) {
            localDevelopment {
                storeFile file(customKeystore)
                storePassword providers.environmentVariable('VOYAH_SIGNING_STORE_PASSWORD').getOrElse('android')
                keyAlias providers.environmentVariable('VOYAH_SIGNING_KEY_ALIAS').getOrElse('cameralab')
                keyPassword providers.environmentVariable('VOYAH_SIGNING_KEY_PASSWORD').getOrElse('android')
            }
        }
    }
    buildTypes {
        debug { if (customKeystore) signingConfig signingConfigs.localDevelopment }
        release { minifyEnabled false; if (customKeystore) signingConfig signingConfigs.localDevelopment }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    // Sideloaded Android 11 head-unit app; Google Play target-level policy is inapplicable.
    // Retain all other release lint checks and the firmware-compatible API 30 target.
    lint { disable 'ExpiredTargetSdkVersion' }
    packaging { jniLibs { useLegacyPackaging = true } } // Keeps OpenCV compressed inside the APK.
    sourceSets.main.jniLibs.srcDir(generatedNative)
}

dependencies { implementation 'org.opencv:opencv:4.12.0' }

def ndkPinned = '27.2.12479018'
def nativeTask = tasks.register('buildAvmViewNative') {
    def exec = objects.newInstance(ExecInjection).exec
    inputs.files(fileTree('src/main/cpp')).withPropertyName('nativeSources')
    inputs.property('ndkVersion', ndkPinned)
    outputs.dir(generatedNative)
    doLast {
        String override = providers.gradleProperty('avmNdkDir').orElse(providers.environmentVariable('AVM_NDK_DIR')).orNull
        File ndk = override ? file(override) : new File(android.sdkDirectory, "ndk/${ndkPinned}")
        boolean windows = System.getProperty('os.name').toLowerCase().contains('windows')
        String host = windows ? 'windows-x86_64' : System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin-x86_64' : 'linux-x86_64'
        File prebuilt = new File(ndk, 'bin/clang' + (windows ? '.exe' : '')).isFile() ? ndk : new File(ndk, "toolchains/llvm/prebuilt/${host}")
        File clang = new File(prebuilt, 'bin/clang' + (windows ? '.exe' : ''))
        if (!clang.isFile()) throw new GradleException("Install NDK ${ndkPinned} or set AVM_NDK_DIR")
        File output = generatedNative.get().dir('arm64-v8a').asFile
        output.mkdirs()
        exec.exec {
            commandLine clang, '--target=aarch64-linux-android30', '--sysroot=' + new File(prebuilt, 'sysroot'),
                '-O2', '-Wall', '-Wextra', '-Werror', '-fPIC', '-shared', '-unwindlib=none', '-Wl,-z,relro,-z,now',
                '-o', new File(output, 'libavmview.so'), file('src/main/cpp/avm_view.c')
        }
    }
}
tasks.named('preBuild').configure { dependsOn nativeTask }

def policyClasses = layout.buildDirectory.dir('policy-classes')
def policyCompile = tasks.register('compileCorePolicyTest', JavaCompile) {
    source files('src/main/java/local/codex/voyahcameralab/FramePolicy.java',
        'src/main/java/local/codex/voyahcameralab/TimestampClock.java',
        'src/main/java/local/codex/voyahcameralab/CaptureGate.java',
        'src/main/java/local/codex/voyahcameralab/FrameHealth.java',
        'src/main/java/local/codex/voyahcameralab/LaunchPolicy.java',
        'src/main/java/local/codex/voyahcameralab/StoragePolicy.java',
        'src/main/java/local/codex/voyahcameralab/SegmentPolicy.java',
        'src/main/java/local/codex/voyahcameralab/PowerHoldPolicy.java',
        'src/main/java/local/codex/voyahcameralab/AvmLayout.java',
        'src/main/java/local/codex/voyahcameralab/AdaptiveViewPolicy.java',
        '../tests/java/local/codex/voyahcameralab/PolicyTest.java',
        '../tests/java/local/codex/voyahcameralab/LaunchPolicyTest.java',
        '../tests/java/local/codex/voyahcameralab/StoragePolicyTest.java',
        '../tests/java/local/codex/voyahcameralab/SegmentPolicyTest.java',
        '../tests/java/local/codex/voyahcameralab/RecordingStoreTest.java',
        '../tests/java/local/codex/voyahcameralab/PowerHoldPolicyTest.java',
        '../tests/java/local/codex/voyahcameralab/AdaptiveViewPolicyTest.java',
        '../tests/java/local/codex/voyahcameralab/AllPolicyTests.java')
    classpath = files()
    destinationDirectory.set(policyClasses)
    options.encoding = 'UTF-8'
    options.release.set(8)
}
tasks.register('corePolicyTest', JavaExec) {
    dependsOn policyCompile
    classpath = files(policyClasses)
    mainClass.set('local.codex.voyahcameralab.AllPolicyTests')
}
tasks.named('check').configure { dependsOn 'corePolicyTest' }
