plugins { id 'com.android.application' }

def customKeystore = providers.environmentVariable('VOYAH_SIGNING_KEYSTORE').orNull
android {
    namespace 'local.codex.voyahcameralab'
    compileSdk 30
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'local.codex.voyahcameralab'
        minSdk 30
        targetSdk 30
        versionCode 5
        versionName '0.5-lite-alpha'
        testApplicationId 'local.codex.voyahcameratest'
        testInstrumentationRunner 'local.codex.voyahcameratest.Smoke'
    }
    signingConfigs {
        if (customKeystore) {
            localDevelopment {
                storeFile file(customKeystore)
                storePassword providers.environmentVariable('VOYAH_SIGNING_STORE_PASSWORD').getOrElse('android')
                keyAlias providers.environmentVariable('VOYAH_SIGNING_KEY_ALIAS').getOrElse('cameralab')
                keyPassword providers.environmentVariable('VOYAH_SIGNING_KEY_PASSWORD').getOrElse('android')
            }
        }
    }
    buildTypes {
        debug { if (customKeystore) signingConfig signingConfigs.localDevelopment }
        release { minifyEnabled false; if (customKeystore) signingConfig signingConfigs.localDevelopment }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    // Sideloaded Android 11 head-unit app; Google Play target-level policy is inapplicable.
    // Retain all other release lint checks and the firmware-compatible API 30 target.
    lint { disable 'ExpiredTargetSdkVersion' }
}

def policyClasses = layout.buildDirectory.dir('policy-classes')
def policyCompile = tasks.register('compileCorePolicyTest', JavaCompile) {
    source files('src/main/java/local/codex/voyahcameralab/FramePolicy.java',
        'src/main/java/local/codex/voyahcameralab/TimestampClock.java',
        'src/main/java/local/codex/voyahcameralab/CaptureGate.java',
        'src/main/java/local/codex/voyahcameralab/FrameHealth.java',
        'src/main/java/local/codex/voyahcameralab/LaunchPolicy.java',
        'src/main/java/local/codex/voyahcameralab/StoragePolicy.java',
        'src/main/java/local/codex/voyahcameralab/SegmentPolicy.java',
        'src/main/java/local/codex/voyahcameralab/PowerHoldPolicy.java',
        '../tests/java/local/codex/voyahcameralab/PolicyTest.java',
        '../tests/java/local/codex/voyahcameralab/LaunchPolicyTest.java',
        '../tests/java/local/codex/voyahcameralab/StoragePolicyTest.java',
        '../tests/java/local/codex/voyahcameralab/SegmentPolicyTest.java',
        '../tests/java/local/codex/voyahcameralab/RecordingStoreTest.java',
        '../tests/java/local/codex/voyahcameralab/PowerHoldPolicyTest.java',
        '../tests/java/local/codex/voyahcameralab/AllPolicyTests.java')
    classpath = files()
    destinationDirectory.set(policyClasses)
    options.encoding = 'UTF-8'
    options.release.set(8)
}
tasks.register('corePolicyTest', JavaExec) {
    dependsOn policyCompile
    classpath = files(policyClasses)
    mainClass.set('local.codex.voyahcameralab.AllPolicyTests')
}
tasks.named('check').configure { dependsOn 'corePolicyTest' }
