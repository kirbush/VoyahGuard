name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-30' 'build-tools;35.0.0'
      - name: Build and run core checks
        run: ./gradlew :app:corePolicyTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VoyahGuard-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: VoyahGuard-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
